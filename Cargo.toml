[workspace]
members = [".", "spacenotes-mcp"]
exclude = ["spacetime-module", "space-channel-server"]
resolver = "2"

[package]
name = "spacenotes"
version = "0.1.0"
edition = "2021"

[dependencies]
spacetimedb-sdk = "2.7"
openssl = { version = "0.10", features = ["vendored"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2.5"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = "0.3"
filetime = "0.2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.11", features = ["v4"] }
regex = "1"
once_cell = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify-debouncer-full = "0.7.0"
