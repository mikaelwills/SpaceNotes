[package]
name = "space-channel-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
