services:
  spacenotes:
    image: ghcr.io/mikaelwills/spacenotes:latest
    container_name: spacenotes
    ports:
      - "5050:3000"  # SpacetimeDB
      - "5051:80"    # Web Client
      - "5052:5052"  # MCP Server
      - "5054:5054"  # SpaceChannelServer - Flutter WebSocket
      - "5055:5055"  # SpaceChannelServer - SpaceChannel client WebSocket
      - "5056:5056"  # SpaceChannelServer - Webhook HTTP
    volumes:
      - /path/to/your/notes:/vault  # Edit this to your notes folder
      - spacetimedb-data:/var/lib/spacetimedb
      - spacetime-config:/root/.config/spacetime  # Persists the publish identity across recreates
      - spacenotes-daemon-data:/data
    environment:
      - DATA_DIR=/data
    restart: unless-stopped

volumes:
  spacetimedb-data:
  spacetime-config:
  spacenotes-daemon-data:
